<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Assistant</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>Web Assistant</h1>
    <button id="open-settings" class="icon-btn" type="button" title="Settings">Settings</button>
  </header>

  <main>
    <div id="no-key-warning" class="warning hidden">
      <p>No API key yet. <a href="#" id="goto-settings">Open settings</a> to add your Anthropic API key.</p>
    </div>

    <div class="form-section">
      <label for="template">Message type</label>
      <select id="template">
        <option value="linkedin_connection">LinkedIn connection note</option>
        <option value="linkedin_message">LinkedIn cold message</option>
        <option value="cold_email">Cold email</option>
        <option value="followup">Follow-up</option>
        <option value="thank_you">Thank you note</option>
        <option value="custom">Custom message</option>
      </select>
    </div>

    <div class="form-section">
      <label for="context">About the recipient</label>
      <textarea id="context" rows="4" placeholder="Paste their LinkedIn profile, role, company, something specific you noticed..."></textarea>
    </div>

    <div class="form-section">
      <label for="goal">What do you want to say?</label>
      <textarea id="goal" rows="3" placeholder="Your reason for reaching out, your ask, key talking points..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-section flex-1">
        <label for="tone">Tone</label>
        <select id="tone">
          <option value="professional">Professional</option>
          <option value="friendly" selected>Friendly</option>
          <option value="casual">Casual</option>
          <option value="direct">Direct</option>
          <option value="warm">Warm</option>
        </select>
      </div>
      <div class="form-section flex-1">
        <label for="length">Length</label>
        <select id="length">
          <option value="short">Short</option>
          <option value="medium" selected>Medium</option>
          <option value="long">Long</option>
        </select>
      </div>
    </div>

    <div class="form-section">
      <label for="model">Model</label>
      <select id="model">
        <optgroup label="Anthropic">
          <option value="claude-opus-4-7">Claude Opus 4.7 — most capable</option>
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6 — balanced</option>
          <option value="claude-haiku-4-5">Claude Haiku 4.5 — fastest</option>
          <option value="claude-opus-4-6">Claude Opus 4.6</option>
          <option value="claude-sonnet-4-5">Claude Sonnet 4.5</option>
        </optgroup>
        <optgroup label="OpenAI">
          <option value="gpt-4o">GPT-4o</option>
          <option value="gpt-4o-mini">GPT-4o mini</option>
          <option value="gpt-4-turbo">GPT-4 Turbo</option>
          <option value="o1">o1 (reasoning)</option>
          <option value="o1-mini">o1-mini (reasoning)</option>
        </optgroup>
        <optgroup label="DeepSeek">
          <option value="deepseek-chat">DeepSeek Chat (V3)</option>
          <option value="deepseek-reasoner">DeepSeek Reasoner (R1)</option>
        </optgroup>
        <optgroup label="Qwen (Alibaba)">
          <option value="qwen-max">Qwen Max — most capable</option>
          <option value="qwen-plus">Qwen Plus — balanced</option>
          <option value="qwen-turbo">Qwen Turbo — fastest</option>
          <option value="qwen-max-longcontext">Qwen Max (long context)</option>
          <option value="qwq-32b-preview">QwQ 32B (reasoning preview)</option>
        </optgroup>
        <option value="__custom__">Custom model ID...</option>
      </select>
      <div id="custom-row" class="custom-row hidden">
        <select id="custom-provider" class="custom-provider">
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="qwen">Qwen</option>
        </select>
        <input type="text" id="custom-model" class="custom-model-input" placeholder="model ID, e.g. deepseek-chat or qwen-max" spellcheck="false" autocomplete="off">
      </div>
    </div>

    <details id="prompt-details" class="prompt-details">
      <summary>
        <span>View system prompt</span>
        <span id="prompt-customized-badge" class="badge hidden">customized</span>
      </summary>
      <pre id="prompt-preview" class="prompt-preview"></pre>
      <a href="#" id="edit-prompts-link" class="edit-prompts-link">Edit prompts in Settings</a>
    </details>

    <button id="generate" class="primary-btn" type="button">Generate</button>

    <div class="output-section">
      <div class="output-header">
        <label>Output</label>
        <div class="output-actions hidden" id="output-actions">
          <button id="copy-btn" class="action-btn" type="button">Copy</button>
          <button id="insert-btn" class="action-btn" type="button" title="Insert into focused text field on the active tab">Insert</button>
          <button id="regenerate-btn" class="action-btn" type="button">Regenerate</button>
        </div>
      </div>
      <div id="output" class="output" contenteditable="true" placeholder="Generated message will appear here. You can edit it before copying or inserting."></div>
      <div id="char-count" class="char-count hidden"></div>
      <div id="error" class="error hidden"></div>
    </div>
  </main>

  <script src="templates.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
